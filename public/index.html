<!DOCTYPE html>

<style>
:root{--ink:#101a2c;--panel:#18263d;--line:#2c3e5e;--text:#eaf0f7;--dim:#93a4bd;--gold:#ffcb47;--good:#4cc38a;--bad:#ff6b6b}
*{box-sizing:border-box;cursor:url(cursor.cur),auto}
button,.btn,a,summary{cursor:url(pointer.cur),pointer}
input{cursor:url(cursor.cur),text}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em;font-weight:700}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05}
.screen{display:none;min-height:100%;padding:24px;align-items:center;justify-content:center}
.screen.on{display:flex}
.card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.card.wide{max-width:600px}
p{color:var(--dim);margin:.2em 0 1em}
input{width:100%;padding:12px 14px;margin:0 0 12px;border-radius:8px;border:1px solid var(--line);background:var(--ink);color:var(--text);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{padding:12px 20px;border:0;border-radius:8px;background:var(--gold);color:#241a00;font:inherit;font-weight:700}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
button:hover{filter:brightness(1.1)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--bad);min-height:1.5em;margin:0 0 6px}
#game{position:relative;padding:0}
#map{position:absolute;inset:0;background:#d0d8e0}
#flagArea{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#1a2a44,#0d1626)}
#flagImg{max-width:min(70vw,420px);max-height:50vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.5);border:3px solid var(--line)}
.top,.bottom{position:absolute;left:0;right:0;z-index:1000;display:flex;gap:12px;align-items:center;padding:12px 16px;background:rgba(16,26,44,.92);backdrop-filter:blur(6px)}
.top{top:0;justify-content:space-between}
.bottom{bottom:0}
.bottom input{margin:0;flex:1}
#time{font:700 1.5rem Georgia,serif;color:var(--gold)}
#time.low{color:var(--bad)}
#over{position:absolute;inset:0;z-index:1001;background:rgba(16,26,44,.92);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#over.on{display:flex}
.ok{color:var(--good)}.no{color:var(--bad)}
ul{list-style:none;padding:0;margin:12px 0}
li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
li small{color:var(--dim);display:block}
.mark{font-weight:700}
.leaflet-container{font:inherit;background:#d0d8e0}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(16,26,44,.7)!important;color:var(--dim)!important;font-size:10px}
.pin-hint{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:999;background:rgba(16,26,44,.85);padding:6px 14px;border-radius:20px;font-size:13px;color:var(--dim);pointer-events:none;white-space:nowrap}
.mode-btn{flex:1;min-width:140px;text-align:center}
.mode-btn small{display:block;font-weight:400;font-size:12px;opacity:.8;margin-top:2px}
</style>
</head>
<body>

<section id="auth" class="screen on"><div class="card">
  <h1>Country Games</h1>
  <p>Map mode or Capitals mode. Sign in to save your scores.</p>
  <input id="u" placeholder="Name" autocomplete="username">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err" id="aerr"></div>
  <div class="row"><button id="in">Sign in</button><button class="alt" id="up">Sign up</button></div>
</div></section>

<section id="menu" class="screen"><div class="card wide">
  <h2>Hi, <span id="who"></span></h2>
  <p>Choose a mode · 5 rounds · 2 minutes each · 1 point per correct answer</p>
  <div class="row" style="margin-top:16px">
    <button class="mode-btn" id="startMap">Map mode<small>Pin on map → guess country</small></button>
    <button class="mode-btn" id="startCapitals">Capitals mode<small>See flag → guess capital</small></button>
  </div>
  <div class="row" style="margin-top:12px"><button class="alt" id="out">Sign out</button></div>
  <h2 style="margin-top:28px;font-size:1.2rem">Your last games</h2>
  <div id="hist"></div>
</div></section>

<section id="game" class="screen">
  <div id="map"></div>
  <div id="flagArea" style="display:none"><img id="flagImg" alt="Flag"></div>
  <div class="pin-hint" id="hint">📍 Pin is fixed — drag &amp; scroll the map (no names shown)</div>
  <div class="top"><span id="rnd"></span><span id="time">2:00</span><span id="pts"></span></div>
  <div class="bottom">
    <input id="guess" placeholder="Type your answer…" autocomplete="off">
    <button id="send">Guess</button>
  </div>
  <div id="over"><div class="card"><div id="overMsg"></div><div class="row" style="justify-content:center"><button id="next">Next</button></div></div></div>
</section>

<section id="end" class="screen"><div class="card wide">
  <h2>Game over: <span id="fin"></span> / 5</h2>
  <ul id="sum"></ul>
  <div class="row"><button id="again">Play again</button><button class="alt" id="home">Menu</button></div>
</div></section>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token = localStorage.getItem('tok'), name = localStorage.getItem('name');
let mode = 'map'; // 'map' or 'capitals'

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

async function api(path, body){
  const r = await fetch('/api/' + path, {
    method: body ? 'POST' : 'GET',
    headers: {'Content-Type':'application/json', Authorization:'Bearer ' + token},
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}

/* ---------- accounts ---------- */
async function authGo(kind){
  try {
    const j = await api(kind, {name: $('u').value, password: $('p').value});
    token = j.token; name = j.name;
    localStorage.setItem('tok', token); localStorage.setItem('name', name);
    openMenu();
  } catch(e){ $('aerr').textContent = e.message; }
}
$('in').onclick = () => authGo('signin');
$('up').onclick = () => authGo('signup');
$('out').onclick = () => { localStorage.clear(); token = name = null; show('auth'); };
$('home').onclick = openMenu;

async function openMenu(){
  $('who').textContent = name; show('menu');
  try {
    const g = await api('games');
    $('hist').innerHTML = g.length ? g.map(x =>
      `<li><span>${new Date(x.date).toLocaleString()} · ${x.mode||'map'}</span><b>${x.score} / 5</b></li>`).join('')
      : '<p>No games yet.</p>';
  } catch(e){ show('auth'); }
}
if (token) openMenu();

const ALIAS = {
  usa:'united states',us:'united states',america:'united states','united states of america':'united states',
  uk:'united kingdom',england:'united kingdom',scotland:'united kingdom',wales:'united kingdom','great britain':'united kingdom',
  'czech republic':'czechia',holland:'netherlands',turkiye:'turkey',"cote d'ivoire":'ivory coast',
  'uae':'united arab emirates',bosnia:'bosnia and herzegovina',macedonia:'north macedonia',
  'washington':'washington dc','washington dc':'washington dc','washington d.c.':'washington dc',
  'new delhi':'new delhi','delhi':'new delhi','brasilia':'brasília','brasilia':'brasília',
  'kiev':'kyiv','peking':'beijing','bombay':'mumbai'
};
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/^the /,'').trim();

function isRightCountry(g, c){
  g = norm(g); g = ALIAS[g] || g;
  return g && (g === norm(c.name) || g === norm(c.name.replace(/ and /g,' ')));
}
function isRightCapital(g, c){
  g = norm(g); g = ALIAS[g] || g;
  const capital = norm(c.capital);
  return g && (g === capital || g === capital.replace(/,/g,'') || capital.includes(g) && g.length > 3);
}

let map, marker, rounds, r, score, left, tick, cur;

function initMap(){
  if (map) return;
  map = L.map('map', {
    center: [20, 0], zoom: 2, minZoom: 2, maxZoom: 12, worldCopyJump: true, zoomControl: true
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 20
  }).addTo(map);
}

function placePin(c){
  if (marker) map.removeLayer(marker);
  const lat = c.lat + (Math.random() - 0.5) * 0.8;
  const lng = c.lng + (Math.random() - 0.5) * 0.8;
  marker = L.marker([lat, lng], {
    icon: L.divIcon({
      className: '',
      html: '<div style="font-size:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));">📍</div>',
      iconSize: [28, 28], iconAnchor: [14, 28]
    })
  }).addTo(map);
  map.setView([lat, lng], 5 + Math.floor(Math.random() * 2));
}

function showFlag(c){
  $('flagImg').src = `https://flagcdn.com/w640/${c.code}.png`;
  $('flagImg').alt = c.name + ' flag';
}

function startGame(m){
  mode = m;
  rounds = []; r = 0; score = 0;
  show('game');
  if (mode === 'map') {
    $('map').style.display = 'block';
    $('flagArea').style.display = 'none';
    $('hint').style.display = 'block';
    $('hint').textContent = '📍 Pin is fixed — drag & scroll the map (no names shown)';
    $('guess').placeholder = 'Type the country…';
    initMap();
    setTimeout(() => { map.invalidateSize(); nextRound(); }, 60);
  } else {
    $('map').style.display = 'none';
    $('flagArea').style.display = 'flex';
    $('hint').style.display = 'block';
    $('hint').textContent = '🏳️ Look at the flag — type the capital city';
    $('guess').placeholder = 'Type the capital…';
    nextRound();
  }
}

$('startMap').onclick = () => startGame('map');
$('startCapitals').onclick = () => startGame('capitals');
$('again').onclick = () => startGame(mode);

function nextRound(){
  r++;
  $('over').classList.remove('on');
  $('guess').value = '';
  $('guess').disabled = $('send').disabled = false;
  $('rnd').textContent = `Round ${r} / 5`;
  $('pts').textContent = `Points: ${score}`;
  cur = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
  if (mode === 'map') placePin(cur);
  else showFlag(cur);
  $('guess').focus();
  left = 120;
  draw();
  clearInterval(tick);
  tick = setInterval(() => { left--; draw(); if (left <= 0) submit(true); }, 1000);
}

function draw(){
  $('time').textContent = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0');
  $('time').className = left <= 20 ? 'low' : '';
}

function submit(timeout){
  clearInterval(tick);
  const g = timeout === true ? '' : $('guess').value.trim();
  if (!g && timeout !== true) {
    tick = setInterval(() => { left--; draw(); if (left <= 0) submit(true); }, 1000);
    return;
  }
  const ok = mode === 'map' ? isRightCountry(g, cur) : isRightCapital(g, cur);
  if (ok) score++;
  const answer = mode === 'map' ? cur.name : cur.capital;
  rounds.push({country: cur.name, capital: cur.capital, guess: g || '(no answer)', ok, secs: 120 - left, mode});
  $('pts').textContent = `Points: ${score}`;
  $('overMsg').innerHTML = `<h2 class="${ok ? 'ok' : 'no'}">${ok ? 'Correct! +1 point' : (g ? 'Not this time' : 'Time is up')}</h2>
    <p>${mode === 'map' ? 'Country' : 'Capital'} was <b style="color:var(--text)">${esc(answer)}</b>
    ${mode === 'capitals' ? ` (${esc(cur.name)})` : ''}${ok ? '' : ` · you wrote ${esc(rounds.at(-1).guess)}`}</p>`;
  $('next').textContent = r >= 5 ? 'See results' : 'Next round';
  $('over').classList.add('on');
}
$('send').onclick = () => submit();
$('guess').onkeydown = e => { if (e.key === 'Enter') submit(); };

$('next').onclick = async () => {
  if (r < 5) return nextRound();
  $('fin').textContent = score;
  $('sum').innerHTML = rounds.map((x, i) =>
    `<li><span><b>Round ${i+1}: ${esc(mode === 'map' ? x.country : x.capital)}</b>
     <small>${mode === 'capitals' ? esc(x.country)+' · ' : ''}You wrote: ${esc(x.guess)} · ${x.secs}s</small></span>
     <span class="mark ${x.ok ? 'ok' : 'no'}">${x.ok ? 'Right' : 'Wrong'}</span></li>`).join('');
  show('end');
  try { await api('games', {rounds, mode}); } catch(e){}
};
</script>
</body>
</html>
